name: PS2
on:
  push:
    branches: [ps2-port]
  pull_request:
  workflow_dispatch:
jobs:
  ps2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 libsdl2-dev pkg-config ffmpeg
      - name: Locked ps2dev, SDL2 without audio, RFAuds2
        run: python3 platform/ps2/bootstrap.py --jobs 4
      - name: Host regressions
        run: |
          . .ps2deps/env.sh
          python3 platform/ps2/tests/run.py --rfa-root "$RFAUDS2_ROOT"
          make -C "$RFAUDS2_ROOT" host-test
      - name: Build both PS2 variants
        run: |
          . .ps2deps/env.sh
          python3 platform/ps2/build.py --audio OFF --jobs 4
          python3 platform/ps2/build.py --audio RFAUDS2 --jobs 4
          python3 platform/ps2/stage.py --zip out/cdogs-sdl-ps2-silent.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cdogs-sdl-ps2
          path: |
            out/ps2/cdogs-sdl.elf
            out/ps2/cdogs-sdl.map
            out/ps2-rfauds2/cdogs-sdl.elf
            out/ps2-rfauds2/cdogs-sdl.map
            out/cdogs-sdl-ps2-silent.zip
          if-no-files-found: error
